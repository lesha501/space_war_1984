- type: gameMap
  id: Oasis
  mapName: 'Oasis'
  mapPath: /Maps/oasis.yml
  minPlayers: 70
  stations:
    Oasis:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Oasis {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'B'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency_accordia.yml
        - type: StationJobs
          availableJobs: # 72 jobs total w/o latejoins & interns, 91 jobs total w/ latejoins & interns
            WFRusDraftee: [-1, -1]
            WFRusRifleman: [-1, -1]
            WFRusMachinegunner: [-1, -1]
            WFRusCommander: [1, 1]
            WFUkrRifleman: [-1, -1]
            WFUkrMachinegunner: [-1, -1]
            WFUkrCommander: [1, 1]
