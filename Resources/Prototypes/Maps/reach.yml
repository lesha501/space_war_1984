- type: gameMap
  id: Reach
  mapName: 'Reach'
  mapPath: /Maps/reach.yml
  minPlayers: 0
  maxPlayers: 7
  stations:
    Reach:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Reach Transport {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'SC'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency.yml
        - type: StationJobs
          availableJobs: # 17 jobs total w/o latejoins, 21 jobs total w/ latejoins
            WFRusDraftee: [-1, -1]
            WFRusRifleman: [-1, -1]
            WFRusMachinegunner: [-1, -1]
            WFRusCommander: [1, 1]
            WFUkrRifleman: [-1, -1]
            WFUkrMachinegunner: [-1, -1]
            WFUkrCommander: [1, 1]
