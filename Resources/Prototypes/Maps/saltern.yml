- type: gameMap
  id: Saltern
  mapName: 'Saltern'
  mapPath: /Maps/saltern.yml
  minPlayers: 0
  maxPlayers: 35
  fallback: true
  stations:
    Saltern:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Saltern {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: StationJobs
          availableJobs: # 45 jobs total w/o latejoins & interns, 62 jobs total w/ latejoins & interns
            WFRusDraftee: [-1, -1]
            WFRusRifleman: [-1, -1]
            WFRusMachinegunner: [-1, -1]
            WFRusCommander: [1, 1]
            WFUkrRifleman: [-1, -1]
            WFUkrMachinegunner: [-1, -1]
            WFUkrCommander: [1, 1]
