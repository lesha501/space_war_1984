- type: gameMap
  id: Plasma
  mapName: 'Plasma'
  mapPath: /Maps/plasma.yml
  minPlayers: 30
  maxPlayers: 80
  stations:
    Plasma:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Plasma {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency_plasma.yml
        - type: StationCargoShuttle
          path: /Maps/Shuttles/cargo_plasma.yml
        - type: StationJobs
          availableJobs: # 66 jobs total w/o latejoins & interns, 91 jobs total w/ latejoins & interns
            WFRusDraftee: [-1, -1]
            WFRusRifleman: [-1, -1]
            WFRusMachinegunner: [-1, -1]
            WFRusCommander: [1, 1]
            WFUkrRifleman: [-1, -1]
            WFUkrMachinegunner: [-1, -1]
            WFUkrCommander: [1, 1]
