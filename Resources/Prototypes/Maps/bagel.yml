- type: gameMap
  id: Bagel
  mapName: 'Bagel Station'
  mapPath: /Maps/bagel.yml
  minPlayers: 35
  maxPlayers: 80
  stations:
    Bagel:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Bagel Station {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency_lox.yml
        - type: StationJobs
          availableJobs: # 60 jobs total w/o latejoins & interns, 77 jobs total w/ latejoins & interns
            WFRusDraftee: [-1, -1]
            WFRusRifleman: [-1, -1]
            WFRusMachinegunner: [-1, -1]
            WFRusCommander: [1, 1]
            WFUkrRifleman: [-1, -1]
            WFUkrMachinegunner: [-1, -1]
            WFUkrCommander: [1, 1]
