
- type: gameMap
  id: Packed
  mapName: 'Packed'
  mapPath: /Maps/packed.yml
  minPlayers: 7
  maxPlayers: 35
  stations:
    Packed:
      stationProto: StandardNanotrasenStation
      components:
      - type: StationNameSetup
        mapNameTemplate: '{0} Packed {1}'
        nameGenerator:
          !type:NanotrasenNameGenerator
          prefixCreator: 'VG'
      - type: StationEmergencyShuttle
        emergencyShuttlePath: /Maps/Shuttles/emergency_crimson.yml
      - type: StationJobs
        availableJobs: # 47 jobs total w/o latejoins & interns, 58 jobs total w/ latejoins & interns
          WFRusDraftee: [-1, -1]
          WFRusRifleman: [-1, -1]
          WFRusMachinegunner: [-1, -1]
          WFRusCommander: [1, 1]
          WFUkrRifleman: [-1, -1]
          WFUkrMachinegunner: [-1, -1]
          WFUkrCommander: [1, 1]
